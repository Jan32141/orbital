name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            python3 \
            libsdl2-dev \
            libvulkan-dev \
            zlib1g-dev \
            rapidjson-dev \
            libfmt-dev \
            libbotan-2-dev \
            libcapstone-dev

      - name: Install imgui (header-only)
        run: |
          mkdir -p /tmp/imgui-install/include
          git clone --depth=1 https://github.com/ocornut/imgui.git /tmp/imgui-src
          cp /tmp/imgui-src/*.h /tmp/imgui-install/include/
          cp /tmp/imgui-src/*.cpp /tmp/imgui-install/include/

      - name: Create missing externals/core.cmake stub
        run: |
          mkdir -p externals
          cat > externals/core.cmake <<'EOF'
          message(STATUS "Using CI stub for core.cmake")
          add_library(orbital_core INTERFACE)
          target_include_directories(orbital_core INTERFACE ${CMAKE_CURRENT_LIST_DIR})
          EOF

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/tmp/imgui-install"

      - name: Build
        run: |
          cd build
          ninja -j$(nproc)

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja sdl2 vulkan-headers zlib rapidjson fmt botan capstone

      - name: Install imgui (header-only)
        run: |
          mkdir -p /tmp/imgui-install/include
          git clone --depth=1 https://github.com/ocornut/imgui.git /tmp/imgui-src
          cp /tmp/imgui-src/*.h /tmp/imgui-install/include/
          cp /tmp/imgui-src/*.cpp /tmp/imgui-install/include/

      - name: Create missing externals/core.cmake stub
        run: |
          mkdir -p externals
          cat > externals/core.cmake <<'EOF'
          message(STATUS "Using CI stub for core.cmake")
          add_library(orbital_core INTERFACE)
          target_include_directories(orbital_core INTERFACE ${CMAKE_CURRENT_LIST_DIR})
          EOF

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/tmp/imgui-install"

      - name: Build
        run: |
          cd build
          ninja -j$(sysctl -n hw.ncpu)

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
          C:/vcpkg/vcpkg install sdl2 vulkan zlib rapidjson fmt botan capstone --triplet x64-windows

      - name: Install imgui (header-only)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:/imgui-install/include | Out-Null
          git clone --depth=1 https://github.com/ocornut/imgui.git C:/imgui-src
          Copy-Item C:/imgui-src/*.h C:/imgui-install/include/
          Copy-Item C:/imgui-src/*.cpp C:/imgui-install/include/

      - name: Create missing externals/core.cmake stub
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path externals | Out-Null
          @'
          message(STATUS "Using CI stub for core.cmake")
          add_library(orbital_core INTERFACE)
          target_include_directories(orbital_core INTERFACE ${CMAKE_CURRENT_LIST_DIR})
          '@@ | Set-Content -Path externals/core.cmake

      - name: Configure
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/imgui-install;C:/vcpkg/installed/x64-windows"

      - name: Build
        shell: powershell
        run: |
          cd build
          cmake --build . --config Release --parallel
